site_name: documaris
site_description: Maritime document generation and compliance automation platform.
site_url: https://edgesentry.github.io/documaris/
repo_url: https://github.com/edgesentry/documaris
repo_name: edgesentry/documaris
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - admonition

nav:
  - Home: index.md
  - Reference:
    - Background: ref-background.md
    - Architecture: ref-architecture.md
    - Compliance Policy: ref-compliance-policy.md
    - Customers: ref-customers.md
    - PIER71 Evaluation: ref-pier71-evaluation.md
  - Roadmap:
    - Overview: roadmap/index.md
  - Related:
    - clarus: https://github.com/edgesentry/clarus
    - arktrace: https://github.com/edgesentry/arktrace
    - indago: https://github.com/edgesentry/indago
    - edgesentry-rs: https://github.com/edgesentry/edgesentry-rs
